<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doug Burguer - Cardápio Digital</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --accent: #ff8c00;
      --gold: #ffc107;
      --text: #ffffff;
      --muted: #b0b0b0;
      --green: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 110px; }
    header {
      background: linear-gradient(180deg, #1f1405 0%, #0f0f0f 100%);
      border-bottom: 2px solid var(--accent);
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { color: var(--gold); font-size: 1.8rem; letter-spacing: 1px; text-transform: uppercase; }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
    .badge {
      display: inline-block;
      background: rgba(255, 140, 0, 0.15);
      border: 1px solid var(--accent);
      color: var(--gold);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-top: 8px;
    }
    .tabs {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 12px 16px;
      background: #141414;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #2a2a2a;
    }
    .tab-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid #333;
      padding: 8px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
    .container { max-width: 680px; margin: 0 auto; padding: 16px; }
    .section-title {
      color: var(--gold);
      font-size: 1.2rem;
      margin: 18px 0 12px;
      padding-left: 10px;
      border-left: 4px solid var(--accent);
    }
    .item-card {
      background: var(--card);
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .item-info h3 { font-size: 1.05rem; color: #fff; }
    .item-info p { font-size: 0.85rem; color: var(--muted); margin-top: 4px; line-height: 1.35; }
    .item-price { color: var(--gold); font-weight: bold; font-size: 1.05rem; margin-top: 8px; }
    .add-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 2px solid var(--accent);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .cart-btn {
      background: var(--green);
      color: #000;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 50;
      overflow-y: auto;
      padding: 16px;
    }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 14px;
      max-width: 520px;
      margin: 20px auto;
      padding: 18px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
    .addons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .addon-label {
      background: #242424;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    input[type="text"], textarea, select {
      width: 100%;
      background: #242424;
      border: 1px solid #3a3a3a;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 12px;
    }
    .cart-item {
      border-bottom: 1px solid #2e2e2e;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .remove-btn { background: #ff4444; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>🍔 Doug Burguer</h1>
  <p>Cibratel II • Itanhaém - SP</p>
  <span class="badge">⏱ Entrega estimada: 30 a 40 min • Pão de Brioche</span>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="filterCat('todos', this)">Todos</button>
  <button class="tab-btn" onclick="filterCat('tradicional', this)">Doug Burger Tradicional</button>
  <button class="tab-btn" onclick="filterCat('especiais', this)">Clássicos Especiais</button>
  <button class="tab-btn" onclick="filterCat('porcoes', this)">Porções</button>
  <button class="tab-btn" onclick="filterCat('bebidas', this)">Bebidas</button>
</div>

<div class="container" id="menu-container"></div>

<div class="cart-bar">
  <div>
    <div style="font-size:0.8rem;color:var(--muted);">Total do Pedido</div>
    <div style="font-size:1.2rem;font-weight:bold;color:var(--gold);" id="cart-total">R$ 0,00</div>
  </div>
  <button class="cart-btn" onclick="openCart()">Ver Sacola (<span id="cart-count">0</span>)</button>
</div>

<!-- Modal Adicionais -->
<div class="modal" id="addon-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modal-item-name" style="color:var(--gold);">Personalizar Lanche</h3>
      <button class="close-btn" onclick="closeModal('addon-modal')">&times;</button>
    </div>
    <p style="font-size:0.85rem;color:var(--muted);">Escolha até 10 acompanhamentos/adicionais:</p>
    <div class="addons-grid" id="addons-list"></div>
    <label style="font-size:0.85rem;">Observação do lanche (ex: sem cebola):</label>
    <input type="text" id="item-obs" placeholder="Digite aqui se desejar...">
    <button class="add-btn" style="width:100%;padding:12px;" onclick="confirmAddItem()">Adicionar à Sacola</button>
  </div>
</div>

<!-- Modal Sacola -->
<div class="modal" id="cart-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 style="color:var(--gold);">Sua Sacola</h3>
      <button class="close-btn" onclick="closeModal('cart-modal')">&times;</button>
    </div>
    <div id="cart-items-list"></div>
    <div style="margin-top:14px;">
      <label style="font-size:0.85rem;">Seu Nome:</label>
      <input type="text" id="client-name" placeholder="Ex: Maria">
      <label style="font-size:0.85rem;">Endereço de Entrega (Rua, Número, Bairro):</label>
      <input type="text" id="client-address" placeholder="Ex: Rua..., nº..., Cibratel II">
      <label style="font-size:0.85rem;">Forma de Pagamento:</label>
      <select id="payment-method">
        <option value="PIX">PIX</option>
        <option value="Cartão de Crédito/Débito">Cartão (Levar maquininha)</option>
        <option value="Dinheiro">Dinheiro</option>
      </select>
      <label style="font-size:0.85rem;">Troco para quanto? (Se for dinheiro):</label>
      <input type="text" id="change-for" placeholder="Ex: Troco para R$ 50,00">
    </div>
    <button class="cart-btn" style="width:100%;margin-top:8px;" onclick="sendWhatsApp()">📲 Enviar Pedido no WhatsApp</button>
  </div>
</div>

<script>
  const WHATSAPP_NUMBER = "5513997814047";

  const MENU_ITEMS = [
    { id: 1, cat: "tradicional", name: "Doug Burguer Simples", desc: "Pão de brioche, hambúrguer artesanal, queijo muçarela, alface, tomate e maionese verde.", price: 18.00, hasAddons: true },
    { id: 2, cat: "tradicional", name: "Doug Salada Bacon", desc: "Pão de brioche, hambúrguer artesanal, queijo cheddar, bacon crocante, alface, tomate e maionese verde.", price: 22.00, hasAddons: true },
    { id: 3, cat: "tradicional", name: "Doug Egg Bacon", desc: "Pão de brioche, hambúrguer artesanal, ovo, bacon, queijo muçarela, alface, tomate e maionese verde.", price: 24.00, hasAddons: true },
    { id: 4, cat: "especiais", name: "Clássico Cheddar Cremoso", desc: "Pão de brioche, 2 hambúrgueres artesanais, duplo cheddar cremoso, cebola roxa caramelizada e bacon.", price: 29.00, hasAddons: true },
    { id: 5, cat: "especiais", name: "Doug Tudo Especial", desc: "Pão de brioche, 2 hambúrgueres artesanais, bacon, ovo, calabresa, cheddar, muçarela, alface, tomate e maionese verde.", price: 34.00, hasAddons: true },
    { id: 6, cat: "porcoes", name: "Batata Frita Individual", desc: "Porção crocante de batata frita sequinha.", price: 14.00, hasAddons: false },
    { id: 7, cat: "porcoes", name: "Batata com Cheddar e Bacon", desc: "Porção generosa coberta com cheddar cremoso e cubos de bacon.", price: 24.00, hasAddons: false },
    { id: 8, cat: "bebidas", name: "Refrigerante Lata 350ml", desc: "Coca-Cola, Guaraná Antarctica ou Fanta (informe na observação).", price: 6.00, hasAddons: false },
    { id: 9, cat: "bebidas", name: "Refrigerante 2 Litros", desc: "Coca-Cola ou Guaraná Antarctica gelado.", price: 14.00, hasAddons: false }
  ];

  const ADDONS = [
    { name: "Maionese Verde", price: 0 },
    { name: "Alface", price: 0 },
    { name: "Tomate", price: 0 },
    { name: "Cebola Roxa", price: 0 },
    { name: "Bacon Extra", price: 4.00 },
    { name: "Cheddar Extra", price: 3.50 },
    { name: "Muçarela Extra", price: 3.50 },
    { name: "Ovo", price: 2.50 },
    { name: "Calabresa", price: 3.50 },
    { name: "Hambúrguer Extra", price: 7.00 }
  ];

  let cart = [];
  let selectedItem = null;

  function renderMenu(filter = 'todos') {
    const container = document.getElementById('menu-container');
    container.innerHTML = '';
    const categories = {
      tradicional: "Doug Burger Tradicional",
      especiais: "Clássicos Especiais",
      porcoes: "Porções",
      bebidas: "Bebidas"
    };

    Object.keys(categories).forEach(catKey => {
      if (filter !== 'todos' && filter !== catKey) return;
      const items = MENU_ITEMS.filter(i => i.cat === catKey);
      if (items.length === 0) return;

      const title = document.createElement('h2');
      title.className = 'section-title';
      title.textContent = categories[catKey];
      container.appendChild(title);

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-info">
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
            <div class="item-price">R$ ${item.price.toFixed(2).replace('.', ',')}</div>
          </div>
          <button class="add-btn" onclick="handleAddClick(${item.id})">+ Pedir</button>
        `;
        container.appendChild(card);
      });
    });
  }

  function filterCat(cat, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMenu(cat);
  }

  function handleAddClick(id) {
    selectedItem = MENU_ITEMS.find(i => i.id === id);
    if (!selectedItem.hasAddons) {
      cart.push({ ...selectedItem, addons: [], obs: '', finalPrice: selectedItem.price });
      updateCartUI();
      return;
    }
    document.getElementById('modal-item-name').textContent = selectedItem.name;
    document.getElementById('item-obs').value = '';
    const list = document.getElementById('addons-list');
    list.innerHTML = ADDONS.map((a, idx) => `
      <label class="addon-label">
        <input type="checkbox" value="${idx}" onchange="limitAddons(this)">
        <span>${a.name} ${a.price > 0 ? '(+R$ ' + a.price.toFixed(2).replace('.', ',') + ')' : '(Grátis)'}</span>
      </label>
    `).join('');
    document.getElementById('addon-modal').style.display = 'block';
  }

  function limitAddons(checkbox) {
    const checked = document.querySelectorAll('#addons-list input:checked');
    if (checked.length > 10) {
      checkbox.checked = false;
      alert('Você pode escolher no máximo 10 acompanhamentos.');
    }
  }

  function confirmAddItem() {
    const checked = Array.from(document.querySelectorAll('#addons-list input:checked'));
    const chosenAddons = checked.map(c => ADDONS[parseInt(c.value)]);
    const addonsTotal = chosenAddons.reduce((sum, a) => sum + a.price, 0);
    const obs = document.getElementById('item-obs').value.trim();

    cart.push({
      ...selectedItem,
      addons: chosenAddons.map(a => a.name),
      obs,
      finalPrice: selectedItem.price + addonsTotal
    });
    closeModal('addon-modal');
    updateCartUI();
  }

  function updateCartUI() {
    const total = cart.reduce((sum, i) => sum + i.finalPrice, 0);
    document.getElementById('cart-total').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
    document.getElementById('cart-count').textContent = cart.length;
  }

  function openCart() {
    const list = document.getElementById('cart-items-list');
    if (cart.length === 0) {
      list.innerHTML = '<p style="color:var(--muted);padding:12px 0;">Sua sacola está vazia.</p>';
    } else {
      list.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong> - R$ ${item.finalPrice.toFixed(2).replace('.', ',')}
            ${item.addons.length ? `<div style="font-size:0.8rem;color:var(--muted);">+ ${item.addons.join(', ')}</div>` : ''}
            ${item.obs ? `<div style="font-size:0.8rem;color:var(--gold);">Obs: ${item.obs}</div>` : ''}
          </div>
          <button class="remove-btn" onclick="removeCartItem(${idx})">X</button>
        </div>
      `).join('');
    }
    document.getElementById('cart-modal').style.display = 'block';
  }

  function removeCartItem(idx) {
    cart.splice(idx, 1);
    updateCartUI();
    openCart();
  }

  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  function sendWhatsApp() {
    if (cart.length === 0) return alert('Adicione pelo menos 1 item antes de enviar.');
    const name = document.getElementById('client-name').value.trim();
    const address = document.getElementById('client-address').value.trim();
    const payment = document.getElementById('payment-method').value;
    const change = document.getElementById('change-for').value.trim();

    if (!name || !address) return alert('Por favor, preencha seu nome e endereço de entrega.');

    let msg = `*NOVO PEDIDO - DOUG BURGUER*\n\n`;
    cart.forEach((item, i) => {
      msg += `*${i + 1}. ${item.name}* - R$ ${item.finalPrice.toFixed(2).replace('.', ',')}\n`;
      if (item.addons.length) msg += `   _Adicionais:_ ${item.addons.join(', ')}\n`;
      if (item.obs) msg += `   _Obs:_ ${item.obs}\n`;
    });

    const total = cart.reduce((sum, i) => sum + i.finalPrice, 0);
    msg += `\n*Total:* R$ ${total.toFixed(2).replace('.', ',')}\n`;
    msg += `*Cliente:* ${name}\n`;
    msg += `*Endereço:* ${address}\n`;
    msg += `*Pagamento:* ${payment}\n`;
    if (change) msg += `*Troco:* ${change}\n`;

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  renderMenu();
</script>
</body>
</html>
